[package]
workspace = "../../../firmware"
#   _app suffix: the plain name is the CMake EXECUTABLE (which must match the module
# directory -- light-flash.ps1 finds module/<target>/<target>.uf2), and CMake target
# names are one namespace with Corrosion's crate targets
name = "light_app_crossfire_pico2"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "crossfire on a Pico 2 with the Waveshare Pico-OLED-1.3 display board: the hardware-bound instantiation -- pins, chip features, shell glue -- around the light_app_crossfire application"

[lib]
crate-type = ["staticlib"]

[dependencies]
light_app_crossfire = { path = "../../../crates/light_app_crossfire" }
light-core = { path = "../../../../light_mk5/crates/light-core" }
light-draw = { path = "../../../../light_mk5/crates/light-draw" }
light-display = { path = "../../../../light_mk5/crates/light-display" }
light-font = { path = "../../../../light_mk5/crates/light-font" }
#   this board's assets live in storage rather than in its image, so it reads the pack
light-assets = { path = "../../../../light_mk5/crates/light-assets", default-features = false }
#   this board can replace its own firmware: the staging session, and the slot it writes into
light-update = { path = "../../../../light_mk5/crates/light-update" }
#   the chip is THIS module's identity: the feature is pinned here, not switched by the
# build system -- a crossfire_pico2 is an RP2350 or it is nothing
#   wifi, because this variant of the board carries the radio -- which also means the pin the
# plain board's indicator sits on is the radio's chip select here, so there is no led in board.rs.
# What that feature supplies is the BUS and the clock, which is all the chip owes a radio
light-rp2 = { path = "../../../../light_mk5/crates/light-rp2", features = ["usb-host", "rp2350", "wifi"] }
#   and the radio's DRIVER, which belongs to the part rather than to the chip -- so this board names
# it directly beside the port rather than reaching it through one. Swapping to a board with a
# different radio part changes this line and not the port.
#   bluetooth, because the same part is wanted for a second thing: carrying instrument traffic to a
# device with no cable on it. Additive to the wireless side -- one part, uploaded once, with the
# over-the-air update path it already had
light-cyw43 = { path = "../../../../light_mk5/crates/light-cyw43", features = ["bluetooth"] }
#   the commit holds core 0's interrupts off while it rewrites the flash it runs from; the
# implementation is the port's
critical-section = "1.2"
