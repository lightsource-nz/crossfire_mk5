#   crossfire's FIRMWARE workspace: the per-board instantiation crates, each naming the chip it
# is. Kept apart from the portable workspace so the host test needs no exclusions and no build
# ever pulls two ports (two `critical-section` implementations) together. Nothing is built
# workspace-wide: CMake/Corrosion builds one instantiation crate at a time.
#
#   The port and the framework crates are path dependencies into the light_mk5 checkout beside
# this one. They belong to that repository's workspace; here they are ordinary path packages,
# which is what lets this project carry its own version, its own keys and its own releases.
[workspace]
resolver = "2"
members = [
        "../module/crossfire_pico/rust",
        "../module/crossfire_pico2/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

#   THE SAME PROFILES THE FRAMEWORK'S OWN FIRMWARE WORKSPACE USES, and they have to be repeated
# here because a profile is read only from the workspace a crate is BUILT in -- the framework's
# settings do not travel with its crates when another project builds them. Without this section
# the default applies, which is no optimisation at all: not merely this project's code but every
# framework crate compiled into it, the port included.
#
#   It is not a small difference, and it does not announce itself. Measured on this board,
# reading the asset region cost about two hundred cycles a byte, which put a third of a second
# into every start-up and read exactly as though the flash interface were misconfigured. It was
# not -- the part was doing quad reads at fifty megahertz the whole time. What was slow was the
# code doing the reading.
#
#   Level one rather than three for the everyday build, matching the framework: it removes the
# pathological cost while leaving the code recognisable in a debugger. A release build takes
# everything.
[profile.dev]
panic = "abort"
opt-level = 1
debug = true

[profile.release]
panic = "abort"
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1

